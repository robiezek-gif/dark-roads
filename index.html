<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dark Roads Quest Board</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap"
    rel="stylesheet"
  >

  <style>

    body {
      margin: 0;
      background: #263033;
      color: #000000;
      font-family: "MedievalSharp", cursive;
    }


    #adventure-board {
      max-width: 1200px;
      margin: auto;
      padding: 40px 20px;

      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(330px, 1fr));

      gap: 30px;
    }


    .quest {
      position: relative;

      height: 460px;

      cursor: pointer;

      background-image:
        url("images/quest-background.png");

      background-size: 100% auto;

      background-position: center -120px;

      background-repeat: no-repeat;

      color: #24150a;

      text-shadow:
        0 1px 2px rgba(255, 240, 210, 0.75);

      padding: 70px 35px 40px;

      box-sizing: border-box;

      overflow: hidden;

      transition: height 0.35s ease;
    }


    .quest:hover {
      transform: scale(1.02);
    }


    .quest-summary {
      text-align: center;

      color: #ffffff;

      text-shadow:
        2px 2px 0 #3a2415,
        -1px -1px 0 #3a2415,
        1px -1px 0 #3a2415,
        -1px 1px 0 #3a2415,
        0 3px 6px rgba(0, 0, 0, 0.9)
    }


    .quest-number {
      font-size: 1.6rem;

      font-weight: bold;

      margin-bottom: 10px;
    }


    .quest-title {
      font-size: 2rem;

      font-weight: bold;

      margin-bottom: 20px;
    }


    .reward {
      font-size: 1.1rem;

      font-weight: bold;

      margin-top: 25px;
    }


    .reward-text {
      margin-top: 5px;

      font-weight: normal;
    }


    .status {
      display: inline-block;

      margin-top: 20px;

      padding: 7px 14px;

      font-weight: bold;

      border-radius: 4px;

      background:
        rgba(255, 255, 255, 0.45);
    }


    .status.full {
      color: #7a3a14;
    }


    .status.canceled {
      color: #7d1515;
    }


    .quest-details {
      display: none;

      margin-top: 25px;

      padding-top: 20px;

      border-top:
        2px solid rgba(50, 30, 15, 0.35);

      text-align: center;
    }


    .quest.expanded .quest-details {
      display: block;
    }


    .quest.expanded {
      height: auto;

      min-height: 900px;

      background-size:
        100% 100%;
    }


    .detail-section {
      margin-bottom: 18px;
    }


    .detail-section strong {
      display: block;

      margin-bottom: 6px;

      text-align: center;

      font-size: 1.15em;

      text-decoration: underline;
    }


    .adventurers {
      margin-top: 8px;

      padding-left: 0;

      list-style-position: inside;

      text-align: center;
    }


    .adventurers li {
      margin-bottom: 5px;
    }


    .player-count {
      margin-top: 8px;

      font-weight: bold;
    }


    .signup-button {
      display: inline-block;

      margin-top: 25px;

      padding: 12px 22px;

      background: #2d3f40;

      color: white;

      text-decoration: none;

      font-weight: bold;

      border-radius: 4px;
    }


    .signup-button:hover {
      background: #d69f06;
    }


    .loading,
    .error,
    .empty {
      grid-column: 1 / -1;

      text-align: center;

      font-size: 1.2rem;
    }


    /* QUEST DETAIL GRID */

    .quest-detail-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 16px;

      margin-top: 20px;
    }


    .quest-detail-grid .detail-section {
  margin: 0;

  background: rgba(255, 235, 190, 0.78);

  padding: 15px 18px;

  border-radius: 4px;

  box-sizing: border-box;
}


    /* FULL-WIDTH SECTIONS */

    .description-section,
    .dm-section,
    .before-signup-section,
    .availability-section,
    .adventurers-section {
      grid-column: 1 / -1;
    }


    /* MOBILE LAYOUT */

    @media (max-width: 600px) {

      .quest-detail-grid {
        grid-template-columns: 1fr;
      }


      .description-section,
      .dm-section,
      .before-signup-section,
      .availability-section,
      .adventurers-section {
        grid-column: auto;
      }

    }


  </style>

</head>


<body>


  <main id="adventure-board">

    <div class="loading">
      Loading quests...
    </div>

  </main>


  <script>


    /*
      QUEST BOARD DATA SOURCE
    */

    const sheetURL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vScVIpcsVt4LqD782FrmRpmiuWrBOyy-tdLHj9MD2jN6HuQrFDTCgoalQae_D9dNKY2_jdfCG_P3tpI/pub?gid=852622382&single=true&output=csv";


    /*
      PLAYER SIGN-UP FORM

      Replace this later with your actual
      Google Form responder link.
    */

    const signUpURL =
  "https://docs.google.com/forms/d/e/1FAIpQLSfNF_efjsPULtO25lTu7jfroEDSSPAWLlJqfD33OnAvRCDfLQ/viewform";


    /*
      CSV PARSER
    */

    function parseCSV(text) {

      const rows = [];

      let row = [];

      let value = "";

      let insideQuotes = false;


      for (let i = 0; i < text.length; i++) {

        const character = text[i];

        const nextCharacter =
          text[i + 1];


        if (character === '"') {

          if (
            insideQuotes &&
            nextCharacter === '"'
          ) {

            value += '"';

            i++;

          } else {

            insideQuotes =
              !insideQuotes;

          }


        } else if (
          character === "," &&
          !insideQuotes
        ) {

          row.push(value);

          value = "";


        } else if (

          (
            character === "\n" ||
            character === "\r"
          ) &&

          !insideQuotes

        ) {

          if (
            character === "\r" &&
            nextCharacter === "\n"
          ) {

            i++;

          }


          row.push(value);

          rows.push(row);


          row = [];

          value = "";


        } else {

          value += character;

        }

      }


      if (
        value.length > 0 ||
        row.length > 0
      ) {

        row.push(value);

        rows.push(row);

      }


      return rows;

    }


    /*
      LOAD QUEST DATA
    */

    fetch(sheetURL)


      .then(response => {

        if (!response.ok) {

          throw new Error(
            "Could not load Quest Board data."
          );

        }


        return response.text();

      })


      .then(csv => {

        const rows =
          parseCSV(csv);


        const headers =
          rows[0];


        const quests =
          rows
            .slice(1)

            .filter(
              row =>
                row.length > 1 &&
                row[1].trim() !== ""
            );


        const board =
          document.getElementById(
            "adventure-board"
          );


        board.innerHTML = "";


        /*
          DISPLAY ONLY OPEN,
          FULL, OR CANCELED QUESTS
        */

        const visibleQuests =
          quests.filter(row => {

            const status =
              row[12]
                ?.trim()
                .toUpperCase();


            return (

              status === "OPEN" ||

              status === "FULL" ||

              status === "CANCELED"

            );

          });


        if (
          visibleQuests.length === 0
        ) {

          board.innerHTML = `

            <div class="empty">

              There are currently no quests posted.

            </div>

          `;


          return;

        }


        visibleQuests.forEach(row => {


          /*
            QUEST BOARD DATA COLUMNS

            A  Quest Number
            B  Adventure Title
            C  DM
            D  Description
            E  Reward
            F  Date
            G  Time
            H  Location
            I  Maximum Players
            J  Character Level
            K  Adventure Type
            L  Player Information
            M  Status
            N  Current Players
            O  Available Slots
            P  Adventurers
          */


          const questNumber =
            row[0] || "";


          const title =
            row[1] || "";


          const dm =
            row[2] || "";


          const description =
            row[3] || "";


          const reward =
            row[4] || "";


          const date =
            row[5] || "";


          const time =
            row[6] || "";


          const location =
            row[7] || "";


          const maximumPlayers =
            row[8] || "";


          const characterLevel =
            row[9] || "";


          const adventureType =
            row[10] || "";


          const playerInformation =
            row[11] || "";


          const status =
            (
              row[12] || ""
            ).toUpperCase();


          const currentPlayers =
            row[13] || "0";


          const availableSlots =
            row[14] || "";


          const adventurers =
            row[15] || "";


          const quest =
            document.createElement(
              "article"
            );


          quest.className =
            "quest";


          /*
            STATUS DISPLAY
          */

          let statusHTML = "";


          if (
            status === "FULL"
          ) {

            statusHTML =
              `
              <div class="status full">
                FULL
              </div>
              `;

          }


          if (
            status === "CANCELED"
          ) {

            statusHTML =
              `
              <div class="status canceled">
                CANCELED
              </div>
              `;

          }


          /*
            ADVENTURER LIST
          */

          let adventurerHTML =
            "<em>No confirmed adventurers yet.</em>";


          if (
            adventurers.trim() !== ""
          ) {

            const adventurerList =
              adventurers

                .split("\n")

                .map(
                  adventurer =>
                    `<li>${adventurer}</li>`
                )

                .join("");


            adventurerHTML =
              `
              <ul class="adventurers">

                ${adventurerList}

              </ul>
              `;

          }


          /*
  SIGN-UP BUTTON
*/

let signUpButton = "";

if (status === "OPEN" && Number(availableSlots) > 0) {

  const questSignUpURL =
    signUpURL +
    "?usp=pp_url&entry.769615682=" +
    encodeURIComponent(title);


  signUpButton =
    `

    <a
      class="signup-button"

      href="${questSignUpURL}"

      target="_blank"

      onclick="event.stopPropagation();"
    >

      SIGN UP FOR THIS QUEST

    </a>

    `;

}


else if (
  status === "OPEN" &&
  Number(availableSlots) <= 0
) {

  signUpButton =
    `

    <div class="quest-full">

      FULL

    </div>

    `;

}


          /*
            BUILD QUEST CARD
          */

          quest.innerHTML = `


           <div class="quest-summary">

          ${signUpButton}

          <div class="quest-number">

          ${questNumber}

          </div>


              <div class="quest-title">

                ${title}

              </div>


              <div class="reward">

                REWARD

              </div>


              <div class="reward-text">

                ${reward}

              </div>


              ${statusHTML}


            </div>


            <div class="quest-details">


              <div class="quest-detail-grid">


                <div
                  class="
                    detail-section
                    description-section
                  "
                >

                  <strong>
                    Description
                  </strong>

                  ${description}

                </div>


                <div
                  class="
                    detail-section
                    dm-section
                  "
                >

                  <strong>
                    Dungeon Master
                  </strong>

                  ${dm}

                </div>


                <div
                  class="
                    detail-section
                    date-time-section
                  "
                >

                  <strong>
                    Date / Time
                  </strong>

                  ${date}

                  <br>

                  ${time}

                </div>


                <div
                  class="
                    detail-section
                    location-section
                  "
                >

                  <strong>
                    Where
                  </strong>

                  ${location}

                </div>


                <div
                  class="
                    detail-section
                    character-level-section
                  "
                >

                  <strong>
                    Character Level
                  </strong>

                  ${characterLevel}

                </div>


                <div
                  class="
                    detail-section
                    adventure-type-section
                  "
                >

                  <strong>
                    Adventure Type
                  </strong>

                  ${adventureType}

                </div>


                <div
                  class="
                    detail-section
                    before-signup-section
                  "
                >

                  <strong>
                    Before You Sign Up
                  </strong>

                  ${playerInformation}

                </div>


                <div
                  class="
                    detail-section
                    availability-section
                  "
                >

                  <strong>
                    Player Seat Availability
                  </strong>


                  <div class="player-count">

                    ${currentPlayers}
                    Filled

                    /

                    ${availableSlots}
                    Available

                  </div>

                </div>


                <div
                  class="
                    detail-section
                    adventurers-section
                  "
                >

                  <strong>
                    Adventurers Signed Up
                  </strong>

                  ${adventurerHTML}

                </div>


              </div>



            </div>


          `;


          /*
            EXPAND / COLLAPSE QUEST
          */

          quest.addEventListener(
            "click",
            () => {

              quest.classList.toggle(
                "expanded"
              );

            }
          );


          board.appendChild(
            quest
          );


        });


      })


      .catch(error => {


        document

          .getElementById(
            "adventure-board"
          )

          .innerHTML = `

            <div class="error">

              Could not load quest data.

            </div>

          `;


        console.error(error);


      });


  </script>


</body>

</html>
