<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >


  <title>Run A Game</title>


  <link
  href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>


  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      background: transparent;

      display: flex;

      justify-content: center;

      align-items: center;

      min-height: 100vh;
    }


    .signup-button {
      display: inline-block;

      position: relative;

      overflow: hidden;

      padding: 14px 28px;

      background: #1a1d1e;

      color: white;

      font-family: "Cinzel", serif;
      font-weight: 700;

      font-size: 1.3rem;

      font-weight: bold;

      text-decoration: none;

      border-radius: 4px;

      border: 1px solid #3f4444;

      transition:
        background 0.8s ease,
        color 0.8s ease,
        box-shadow 0.8s ease,
        transform 0.5s ease;

      box-shadow:
        0 0 0 rgba(214, 159, 6, 0);
    }


    .signup-button:hover {
      background: #d69f06;

      color: #ffffff;

      transform: scale(1.04);

      box-shadow:
        0 0 8px rgba(255, 210, 70, 0.8),
        0 0 20px rgba(255, 190, 40, 0.65),
        0 0 45px rgba(255, 180, 20, 0.45);
    }


    .signup-button::before {
      content: "";

      position: absolute;

      top: -100%;

      left: -100%;

      width: 300%;

      height: 300%;

      opacity: 0;

      background:
        radial-gradient(
          circle,
          rgba(255, 255, 210, 0.9) 0%,
          rgba(255, 220, 90, 0.4) 12%,
          transparent 35%
        );

      transform: rotate(25deg);

      transition:
        opacity 0.7s ease,
        transform 1.2s ease;

      pointer-events: none;
    }


    .signup-button:hover::before {
      opacity: 1;

      transform:
        rotate(25deg)
        translate(25%, 25%);
    }


  </style>

</head>


<body>


  <a
    class="signup-button"

    href="https://docs.google.com/forms/d/e/1FAIpQLSfZbA5ks_5tnbxtUPqESMshoxGowbhQsIvTtZS6tMGD2Vp2Ew/viewform?usp=header"

    target="_blank"
  >

    RUN A GAME

  </a>


</body>

</html>
